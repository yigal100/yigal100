# Configuration file for git-cliff
# Reference: https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog

All notable changes to the @yigal100 profile repository will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)
and [Conventional Commits](https://www.conventionalcommits.org/).

"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} [**BREAKING**]{% endif %}
{% endfor -%}
{% endfor %}
"""

# Template for the changelog footer
footer = """
<!-- Generated by git-cliff -->
"""

# Remove leading and trailing whitespace
trim = true

[git]
# Parse the commits based on Conventional Commits
conventional_commits = true
# Filter out commits that do not match Conventional Commits specification
filter_unconventional = true
# Process each line of a commit as an individual commit
split_commits = false
# Regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat(\\([^)]+\\))?!?:", group = "Features" },
    { message = "^fix(\\([^)]+\\))?!?:", group = "Bug Fixes" },
    { message = "^perf(\\([^)]+\\))?!?:", group = "Performance" },
    { message = "^docs(\\([^)]+\\))?!?:", group = "Documentation" },
    { message = "^style(\\([^)]+\\))?!?:", group = "Styling" },
    { message = "^refactor(\\([^)]+\\))?!?:", group = "Refactoring" },
    { message = "^test(\\([^)]+\\))?!?:", group = "Testing" },
    { message = "^build(\\([^)]+\\))?!?:", group = "Build System & Dependencies" },
    { message = "^ci(\\([^)]+\\))?!?:", group = "CI/CD" },
    { message = "^revert(\\([^)]+\\))?!?:", group = "Reverts" },
    { message = "^chore\\(release\\)!?:", skip = true },
    { message = "^chore\\(deps.*\\)!?:", skip = true },
    { message = "^chore\\(ci\\)!?:", skip = true },
    { message = "^chore(\\([^)]+\\))?!?:", group = "Miscellaneous Chores" },
]
# Protect breaking changes from being skipped
protect_breaking_commits = true
# Filter out commits that are not matched by commit_parsers
filter_commits = false
# Sort the tags topologically
topo_order = false
# Sort the commits inside sections by oldest/newest
sort_commits = "oldest"

# Regex to match existing release tags
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
