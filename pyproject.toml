[project]
name = "profile-console"
dynamic = ["version"]
description = "Dynamic cyberpunk terminal profile generator for GitHub"
readme = "README.md"
authors = [
    { name = "Yigal Chripun", email = "579788+yigal100@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brotli==1.2.0",
    "fonttools==4.62.1",
    "typer>=0.29.1",
]

[project.scripts]
profile = "profile_console.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_console"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # line length (multiline SVG markup and templates)
]
