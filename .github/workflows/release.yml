name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Generate release notes
        run: |
          {
            echo "**Live Theme Preview:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo ""
            git-cliff --latest --strip header
          } > /tmp/release-notes.md

      - name: Build preview gallery and wheel
        run: |
          uv run profile preview --bundle
          mv preview/bundle.html "theme-preview-${{ github.ref_name }}.html"
          uv build --wheel --out-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "theme-preview-${{ github.ref_name }}.html" \
            dist/*.whl \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
