name: Update profile

on:
  schedule:
    - cron: "17 12 * * *"            # daily at 12:17 …
      timezone: "Australia/Melbourne" # … Melbourne time (IANA zone name)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [master, main]
    paths:                   # re-render right away when the generator itself changes
      - "src/profile_console/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".mise/config.toml"
      - ".mise/mise.lock"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write            # needed to commit the refreshed files

concurrency:
  group: update-profile      # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v5

      - name: Sync profile
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional: adds private contributions
          GITHUB_TOKEN: ${{ github.token }}             # fallback: public data only
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}       # optional: adds DEV views and followers
        run: mise run sync

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile stats"
            git push
          fi