[tools]
markdownlint-cli2 = "latest"
git-cliff = "latest"
act = "latest"

[settings]
experimental = true
auto_env = true
locked = true
lockfile = true
lockfile_auto_prune = true
skills.prune = true
skills.auto_sync = true

[tasks.render]
description = "Render profile SVGs from data/*.json"
run = "python tools/profile/render.py"

[tasks.fetch]
description = "Fetch latest GitHub and DEV stats into data/*.json"
run = "python tools/profile/fetch.py"

[tasks.update]
description = "Render profile SVGs and synchronize README.md"
run = """
python tools/profile/render.py
python tools/profile/readme.py
"""

[tasks.changelog]
description = "Generate CHANGELOG.md from Conventional Commits"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview unreleased changelog in terminal"
run = "git-cliff --unreleased"

[tasks.release]
description = "Cut a new release (calculate version, update CHANGELOG.md, commit, and tag)"
run = """
#!/usr/bin/env bash
set -euo pipefail

if ! git diff-index --quiet HEAD --; then
  echo "Error: Uncommitted changes detected. Commit or stash them before cutting a release." >&2
  exit 1
fi

if [ -n "${1:-}" ]; then
  VERSION="$1"
else
  VERSION="$(git-cliff --bumped-version 2>/dev/null || true)"
  if [ -z "$VERSION" ]; then
    echo "Error: Could not determine next version automatically." >&2
    echo "Usage: mise run release -- [version]" >&2
    exit 1
  fi
fi

TAG="v${VERSION#v}"
echo "==> Cutting release: ${TAG}"

git-cliff --tag "${TAG}" -o CHANGELOG.md
git add CHANGELOG.md
git commit -m "chore(release): prepare for ${TAG}"
git tag -a "${TAG}" -m "Release ${TAG}"

echo "==> Release ${TAG} created successfully!"
echo "    Commit: $(git rev-parse --short HEAD)"
echo "    Tag:    ${TAG}"
echo "    Push:   git push origin HEAD --tags"
"""

[tasks."release:dry-run"]
description = "Preview release notes and version calculation without creating commit or tag"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [ -n "${1:-}" ]; then
  VERSION="$1"
else
  VERSION="$(git-cliff --bumped-version 2>/dev/null || true)"
fi

TAG="v${VERSION#v}"
echo "==> [Dry Run] Target release: ${TAG}"
echo "==> [Dry Run] Generated release notes preview:"
echo ""
git-cliff --tag "${TAG}" --unreleased
"""
