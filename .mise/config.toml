[tools]
markdownlint-cli2 = "latest"
git-cliff = "latest"
act = "latest"
python = "3.12"
uv = "latest"
ruff = "latest"
ty = "latest"

[deps.uv]
auto = true

[settings]
experimental = true
auto_env = true
locked = true
lockfile = true
lockfile_auto_prune = true
skills.prune = true
skills.auto_sync = true

[tasks.clean]
description = "Remove generated SVG assets"
run = "rm -rf assets"

[tasks.fetch]
description = "Fetch latest GitHub and DEV stats into data/*.json"
usage = '''
flag "-d --data <dir>" help="Folder to write stats.json, articles.json, and calendar.json (default: data)"
flag "-c --config <file>" help="Path to profile.toml (default: profile.toml)"
'''
run = 'uv run profile fetch ${usage_data:+--data "$usage_data"} ${usage_config:+--config "$usage_config"}'

[tasks.render]
description = "Render profile SVGs from data/*.json"
depends = ["clean"]
usage = '''
flag "-d --data <dir>" help="Folder with stats.json and articles.json (default: data)"
flag "-o --out <dir>" help="Folder to write the SVGs into (default: assets, or preview with --all)"
flag "-c --config <file>" help="Path to profile.toml (default: profile.toml)"
flag "-t --theme <name>" help="Override theme preset (default: from strategy)" {
  choices "arcane-architect" "astrometrics" "cyberpunk" "monochrome-ink" "nordic-fjord" "origami" "retro-amber" "solarpunk" "studio" "synthwave"
}
flag "-m --mode <mode>" help="Override color mode (default: from profile.toml)" {
  choices "dark" "light" "adaptive"
}
flag "-s --strategy <strategy>" help="Theme selection strategy (default: rotate)" {
  choices "fixed" "rotate" "random"
}
flag "-a --all" help="Render all themes into <out>/<theme>/ for local preview"
'''
run = 'uv run profile render ${usage_data:+--data "$usage_data"} ${usage_out:+--out "$usage_out"} ${usage_config:+--config "$usage_config"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"} ${usage_all:+--all}'

[tasks.preview]
description = "Render all themes and build interactive preview gallery into preview/"
usage = '''
flag "-d --data <dir>" help="Folder with stats.json and articles.json (default: data)"
flag "-o --out <dir>" help="Folder to write theme previews into (default: preview)"
flag "-c --config <file>" help="Path to profile.toml (default: profile.toml)"
flag "-m --mode <mode>" help="Override color mode (default: from profile.toml)" {
  choices "dark" "light" "adaptive"
}
flag "-b --bundle" help="Also write a self-contained single-file preview/bundle.html"
flag "--skip-render" help="Reuse existing SVGs in <out> instead of re-rendering"
'''
run = 'uv run profile preview ${usage_data:+--data "$usage_data"} ${usage_out:+--out "$usage_out"} ${usage_config:+--config "$usage_config"} ${usage_mode:+--mode "$usage_mode"} ${usage_bundle:+--bundle} ${usage_skip_render:+--skip-render}'

[tasks.readme]
description = "Synchronize dynamic README.md blocks"
usage = '''
flag "-d --data <dir>" help="Folder with stats.json and articles.json (default: data)"
flag "-t --theme <name>" help="Override theme preset (default: from .theme.json or strategy)" {
  choices "arcane-architect" "astrometrics" "cyberpunk" "monochrome-ink" "nordic-fjord" "origami" "retro-amber" "solarpunk" "studio" "synthwave"
}
flag "-m --mode <mode>" help="Override color mode (default: from .theme.json or profile.toml)" {
  choices "dark" "light" "adaptive"
}
flag "-s --strategy <strategy>" help="Theme selection strategy (default: rotate)" {
  choices "fixed" "rotate" "random"
}
'''
run = 'uv run profile readme ${usage_data:+--data "$usage_data"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"}'

[tasks.update]
description = "Render profile SVGs and synchronize README.md"
usage = '''
flag "-d --data <dir>" help="Folder with stats.json and articles.json (default: data)"
flag "-o --out <dir>" help="Folder to write the SVGs into (default: assets)"
flag "-c --config <file>" help="Path to profile.toml (default: profile.toml)"
flag "-t --theme <name>" help="Override theme preset (default: from strategy)" {
  choices "arcane-architect" "astrometrics" "cyberpunk" "monochrome-ink" "nordic-fjord" "origami" "retro-amber" "solarpunk" "studio" "synthwave"
}
flag "-m --mode <mode>" help="Override color mode (default: from profile.toml)" {
  choices "dark" "light" "adaptive"
}
flag "-s --strategy <strategy>" help="Theme selection strategy (default: rotate)" {
  choices "fixed" "rotate" "random"
}
'''
run = '''
mise run render ${usage_data:+--data "$usage_data"} ${usage_out:+--out "$usage_out"} ${usage_config:+--config "$usage_config"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"} &&
mise run readme ${usage_data:+--data "$usage_data"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"}
'''

[tasks.sync]
description = "Fetch fresh data, render SVGs, and synchronize README.md"
# alias = "default"
usage = '''
flag "-d --data <dir>" help="Folder with stats.json and articles.json (default: data)"
flag "-o --out <dir>" help="Folder to write the SVGs into (default: assets)"
flag "-c --config <file>" help="Path to profile.toml (default: profile.toml)"
flag "-t --theme <name>" help="Override theme preset (default: from strategy)" {
  choices "arcane-architect" "astrometrics" "cyberpunk" "monochrome-ink" "nordic-fjord" "origami" "retro-amber" "solarpunk" "studio" "synthwave"
}
flag "-m --mode <mode>" help="Override color mode (default: from profile.toml)" {
  choices "dark" "light" "adaptive"
}
flag "-s --strategy <strategy>" help="Theme selection strategy (default: rotate)" {
  choices "fixed" "rotate" "random"
}
'''
run = '''
mise run fetch ${usage_data:+--data "$usage_data"} ${usage_config:+--config "$usage_config"} &&
mise run update ${usage_data:+--data "$usage_data"} ${usage_out:+--out "$usage_out"} ${usage_config:+--config "$usage_config"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"}
'''

[tasks.check]
description = "Run all code, markdown, and type checks"
depends = ["lint", "lint:md", "typecheck"]

[tasks.lint]
description = "Lint Python code with ruff"
run = "ruff check ."

[tasks."lint:md"]
description = "Lint markdown files with markdownlint-cli2"
run = "markdownlint-cli2 '**/*.md'"

[tasks.fmt]
description = "Format Python code with ruff"
run = "ruff format ."

[tasks.typecheck]
description = "Type check Python code with ty"
run = "ty check"

[tasks.changelog]
description = "Generate CHANGELOG.md from Conventional Commits"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview unreleased changelog in terminal"
run = "git-cliff --unreleased"
