[tools]
markdownlint-cli2 = "latest"
git-cliff = "latest"
act = "latest"
python = "3.12"
uv = "latest"
ruff = "latest"
ty = "latest"

[deps.uv]
auto = true

[settings]
experimental = true
auto_env = true
locked = true
lockfile = true
lockfile_auto_prune = true
skills.prune = true
skills.auto_sync = true

[tasks.fetch]
description = "Fetch latest GitHub and DEV stats into data/*.json"
run = "uv run profile fetch"

[tasks.render]
description = "Render profile SVGs from data/*.json"
run = "uv run profile render"

[tasks.readme]
description = "Synchronize dynamic README.md blocks"
run = "uv run profile readme"

[tasks.update]
description = "Render profile SVGs and synchronize README.md"
run = ["mise run render", "mise run readme"]

[tasks.sync]
description = "Fetch fresh data, render SVGs, and synchronize README.md"
run = ["mise run fetch", "mise run update"]

[tasks.lint]
description = "Lint Python code with ruff"
run = "ruff check ."

[tasks."lint:md"]
description = "Lint markdown files with markdownlint-cli2"
run = "markdownlint-cli2 '**/*.md'"

[tasks.fmt]
description = "Format Python code with ruff"
run = "ruff format ."

[tasks.typecheck]
description = "Type check Python code with ty"
run = "ty check"

[tasks.changelog]
description = "Generate CHANGELOG.md from Conventional Commits"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview unreleased changelog in terminal"
run = "git-cliff --unreleased"
