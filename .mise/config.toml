[tools]
markdownlint-cli2 = "latest"
git-cliff = "latest"
act = "latest"
python = "3.12"
uv = "latest"
ruff = "latest"
ty = "latest"

[deps.uv]
auto = true

[settings]
experimental = true
auto_env = true
locked = true
lockfile = true
lockfile_auto_prune = true
skills.prune = true
skills.auto_sync = true

[tasks.clean]
description = "Remove generated SVG assets"
run = "rm -rf assets"

[tasks.fetch]
description = "Fetch latest GitHub and DEV stats into data/*.json"
usage = '''
flag "--data <dir>" help="Folder to write stats.json, articles.json, and calendar.json"
flag "--config <file>" help="Path to profile.toml"
'''
run = 'uv run profile fetch ${usage_data:+--data "$usage_data"} ${usage_config:+--config "$usage_config"}'

[tasks.render]
description = "Render profile SVGs from data/*.json"
depends = ["clean"]
usage = '''
flag "--data <dir>" help="Folder with stats.json and articles.json"
flag "--out <dir>" help="Folder to write the SVGs into"
flag "--config <file>" help="Path to profile.toml"
flag "--theme <name>" help="Override theme preset (astrometrics, arcane-architect, studio, cyberpunk)"
flag "--mode <mode>" help="Override color mode (dark, light, adaptive)"
flag "--strategy <strategy>" help="Theme selection strategy (fixed, rotate, random)"
'''
run = 'uv run profile render ${usage_data:+--data "$usage_data"} ${usage_out:+--out "$usage_out"} ${usage_config:+--config "$usage_config"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"}'

[tasks.readme]
description = "Synchronize dynamic README.md blocks"
usage = '''
flag "--data <dir>" help="Folder with stats.json and articles.json"
flag "--theme <name>" help="Override theme preset"
flag "--mode <mode>" help="Override color mode"
flag "--strategy <strategy>" help="Theme selection strategy"
'''
run = 'uv run profile readme ${usage_data:+--data "$usage_data"} ${usage_theme:+--theme "$usage_theme"} ${usage_mode:+--mode "$usage_mode"} ${usage_strategy:+--strategy "$usage_strategy"}'

[tasks.update]
description = "Render profile SVGs and synchronize README.md"
run = [{ task = "render" }, { task = "readme" }]

[tasks.sync]
description = "Fetch fresh data, render SVGs, and synchronize README.md"
depends = ["fetch"]
run = [{ task = "update" }]

[tasks.check]
description = "Run all code, markdown, and type checks"
depends = ["lint", "lint:md", "typecheck"]

[tasks.lint]
description = "Lint Python code with ruff"
run = "ruff check ."

[tasks."lint:md"]
description = "Lint markdown files with markdownlint-cli2"
run = "markdownlint-cli2 '**/*.md'"

[tasks.fmt]
description = "Format Python code with ruff"
run = "ruff format ."

[tasks.typecheck]
description = "Type check Python code with ty"
run = "ty check"

[tasks.changelog]
description = "Generate CHANGELOG.md from Conventional Commits"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview unreleased changelog in terminal"
run = "git-cliff --unreleased"
