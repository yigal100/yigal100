<rect x="31.5" y="23" width="18" height="18" rx="3" fill="#0284c7"/><text x="40.5" y="36.5" text-anchor="middle" font-weight="700" fill="#f4f7fb" style="font-size:12px">in</text>
<text x="57.5" y="37" font-weight="700" class="wh" style="font-size:13px">LinkedIn</text>
<text x="31.5" y="58" class="dim" style="font-size:10px">in/yigal</text>
