<title id="t">Tech stack</title>
<desc id="d">Tech stack. architecture: System Design, Cloud Architecture, Distributed Systems. practices: Agile, Clean Code, AI Native. cloud &amp; devops: AWS, Terraform, Databricks, Serverless, Event-Driven, Solace &amp; Kafka. Data Engineering &amp; Analytics: Streaming, Data Lake, ETL. languages: Rust, Python, C++, TypeScript, C#, Java, Go.</desc>
