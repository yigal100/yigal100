<desc id="d">Tech stack. architecture: System Design, Cloud Architecture, Distributed Systems. cloud &amp; aws: AWS, Containers, Serverless, Event-Driven. languages: Rust, TypeScript, Python, C#, Go, C++. practices: Continuous Learning, Clean Code, Design Patterns. tooling: Obsidian, Git, Docker, Linux.</desc>
