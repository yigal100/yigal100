@keyframes kusu-shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.45}}
@keyframes kusu-ring{from{stroke-dashoffset:0}to{stroke-dashoffset:-32}}
@keyframes hanko-pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.kusu-float{transform-origin:320.0px 294.0px;animation:kusu-float 4s ease-in-out infinite}
.kusu-shadow{animation:kusu-shadow 4s ease-in-out infinite}
.kusu-ring{animation:kusu-ring 2.2s linear infinite}
.hanko-ring{animation:hanko-pulse 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
